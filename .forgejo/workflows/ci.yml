name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"
jobs:
  cargo:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy
      - name: Native HTTP example build dependencies
        run: apt-get update -qq && apt-get install -y -qq pkg-config libssl-dev libcurl4-openssl-dev
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy and declared compiler
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Full feature and example tests
        run: |
          set -euo pipefail
          cargo test --all-features --locked
          cargo test --tests --examples --locked
          cargo test --doc --no-default-features --locked
          cargo test --tests --features curl --no-default-features --locked
      - name: Fetch advisory database
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/RustSec/advisory-db /tmp/oauth2-advisory-db
      - name: RustSec audit
        run: |
          set -euo pipefail
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --no-fetch --db /tmp/oauth2-advisory-db
      - name: OSV dependency audit
        env:
          OSV_SCANNER_VERSION: 2.5.1
          OSV_SCANNER_SHA256: f9f25499a2c8cc367b3af45df2ea7eeca7fbccceab9c35079968f4b3652194be
        run: |
          set -euo pipefail
          binary="$(mktemp)"
          trap 'rm "$binary"' EXIT
          curl --fail --location --silent --show-error -o "$binary" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  ${binary}" | sha256sum -c -
          chmod +x "$binary"
          "$binary" scan source --lockfile Cargo.lock
